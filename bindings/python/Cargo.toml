[package]
name = "bothy-python"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Native module of the bothy Python package."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
bothy = { path = "../../crates/bothy" }
bothy-oauth = { path = "../../crates/bothy-oauth" }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "time", "sync"] }

# Built by maturin, not part of the main workspace (pyo3's generated code needs `unsafe`).
[workspace]
