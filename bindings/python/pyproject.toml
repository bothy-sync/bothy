[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bothy"
version = "0.5.0"
description = "Serverless, local-first sync engine that uses your own Google Drive as the transport."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "The Bothy Contributors" }]
keywords = ["sync", "local-first", "offline", "google-drive", "embedded"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bothy-sync/bothy"
Repository = "https://github.com/bothy-sync/bothy"
Issues = "https://github.com/bothy-sync/bothy/issues"

[tool.maturin]
python-source = "python"
module-name = "bothy._native"
features = []
