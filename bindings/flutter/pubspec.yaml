name: bothy
description: >-
  Serverless, local-first sync engine that uses the user's own Google Drive as the transport.
  Documents live in a local SQLite database and sync through the user's Drive, optionally
  end-to-end encrypted.
version: 0.0.1
homepage: https://github.com/bothy-sync/bothy
repository: https://github.com/bothy-sync/bothy/tree/main/bindings/flutter
issue_tracker: https://github.com/bothy-sync/bothy/issues
topics:
  - sync
  - offline-first
  - google-drive
  - database

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
