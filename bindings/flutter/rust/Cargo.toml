[package]
name = "bothy_flutter"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Native library of the bothy Flutter package."
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
async-trait = "0.1"
bothy = { path = "../../../crates/bothy" }
flutter_rust_bridge = "=2.13.0"
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync"] }
zeroize = "1.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Built by cargokit from the Flutter package, not part of the main workspace.
[workspace]
