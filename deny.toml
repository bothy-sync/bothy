# cargo-deny: licences, security advisories, duplicate and untrusted sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # zvariant and zbus_names were folded into zbus 6 (October 2026): unmaintained, not
  # vulnerable. They come in through keyring's Linux Secret Service store, which is still on
  # zbus 5. Remove once keyring moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "unmaintained only; via keyring on Linux" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained only; via keyring on Linux" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained only; via keyring on Linux" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
