[workspace]
resolver = "3"
members = ["crates/bothy", "crates/bothy-cli", "crates/bothy-conformance"]
exclude = ["fuzz", "bindings/flutter/rust"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["The Bothy Contributors"]
repository = "https://github.com/bothy-sync/bothy"
homepage = "https://github.com/bothy-sync/bothy"

[workspace.dependencies]
bothy = { path = "crates/bothy", version = "0.2.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
