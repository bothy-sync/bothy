[package]
name = "bothy-oauth"
description = "Google OAuth helpers for Bothy: loopback and device sign-in, token refresh and a token store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["oauth", "google-drive", "device-flow", "pkce"]
categories = ["authentication"]

[features]
default = ["keyring"]
# Keep grants in the OS keyring (falls back to a 0600 file).
keyring = ["dep:keyring"]

[dependencies]
async-trait = "0.1"
base64 = "0.23"
bothy = { path = "../bothy", version = "0.5.0", default-features = false }
getrandom = "0.4"
keyring = { version = "4.2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.54", features = ["io-util", "net", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
