[package]
name = "bothy"
description = "Serverless, local-first sync engine that uses the user's own cloud storage (Google Drive) as the transport. Early development."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bothy"
readme = "README.md"
keywords = ["sync", "local-first", "offline", "google-drive", "hlc"]
categories = ["database", "network-programming"]

[dependencies]
async-trait = "0.1"
base64 = "0.23"
blake3 = "1.8"
fs4 = "1.1"
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt", "sync", "time"] }
zstd = "0.14"

[dev-dependencies]
ciborium = "0.2"
proptest = "1.12"
tempfile = "3"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
