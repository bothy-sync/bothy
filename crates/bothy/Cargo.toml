[package]
name = "bothy"
description = "Serverless, local-first sync engine that uses the user's own cloud storage (Google Drive) as the transport. Early development."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bothy"
readme = "README.md"
keywords = ["sync", "local-first", "offline", "google-drive", "hlc"]
categories = ["database", "network-programming"]

[features]
default = ["blocking", "crypto", "drive"]
# Synchronous API with its own runtime, for the CLI and bindings.
blocking = ["tokio/rt-multi-thread"]
# Fault-injecting remote for tests and simulations.
test-util = []
# Google Drive backend (Drive API v3 over rustls with the ring provider).
drive = ["dep:reqwest", "dep:rustls", "dep:sha2"]
# Client-side encryption: Argon2id and XChaCha20-Poly1305.
crypto = ["dep:argon2", "dep:chacha20poly1305", "dep:zeroize"]

[dependencies]
argon2 = { version = "0.6", optional = true }
async-trait = "0.1"
base64 = "0.23"
blake3 = "1.8"
chacha20poly1305 = { version = "0.11", optional = true }
fs4 = "1.1"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
tokio = { version = "1.54", features = ["macros", "rt", "sync", "time"] }
zeroize = { version = "1.9", optional = true }
zstd = "0.14"

[dev-dependencies]
ciborium = "0.2"
proptest = "1.12"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
