name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy -p bothy --no-default-features --all-targets --locked -- -D warnings
      - run: cargo clippy -p bothy --all-features --all-targets --locked -- -D warnings

  simulation:
    name: Simulation (500 seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bothy --features test-util --test simulation --release --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  cross:
    name: Cross build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --locked --release -p bothy-cli --target ${{ matrix.target }}

  rust-msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  rust-package:
    name: crates.io dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --workspace --dry-run --locked

  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm pack --dry-run

  flutter:
    name: Flutter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings/flutter
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/flutter/rust
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter pub get
        working-directory: bindings/flutter/example
      - run: dart format --output=none --set-exit-if-changed lib/src/bothy.dart lib/bothy.dart lib/src/hlc.dart test example/lib
      - run: flutter analyze --fatal-infos
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml -- -D warnings
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml
      - run: flutter test
      - name: Build the example app
        working-directory: bindings/flutter/example
        run: |
          case "$RUNNER_OS" in
            Linux) flutter build linux --debug && flutter build apk --debug ;;
            macOS) flutter build macos --debug && flutter build ios --simulator --debug ;;
            Windows) flutter build windows --debug ;;
          esac
      # flutter_rust_bridge is pinned on purpose (the Dart runtime must match the generated
      # code), so its "should allow more than one version" warning is the only one allowed.
      - name: pub publish --dry-run
        if: runner.os == 'Linux'
        run: |
          set +e
          out=$(flutter pub publish --dry-run 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          echo "$out" | grep -q 'Package has 1 warning' \
            && echo "$out" | grep -q 'dependency on "flutter_rust_bridge" should allow more than one version' \
            || exit 1
  flutter-notes:
    name: Flutter demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: examples/flutter-notes
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/flutter/rust
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib integration_test tool
      - run: flutter analyze --fatal-infos
      - name: Build
        run: |
          case "$RUNNER_OS" in
            Linux) flutter build linux --debug && flutter build apk --debug ;;
            macOS) flutter build macos --debug && flutter build ios --simulator --debug ;;
            Windows) flutter build windows --debug ;;
          esac
      - name: Integration test (local folder remote)
        if: runner.os == 'macOS'
        run: flutter test integration_test -d macos --dart-define=BOTHY_LOCAL_REMOTE=it-remote

